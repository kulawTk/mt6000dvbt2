name: build MT6000 DVB 25.12.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev

      - uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.5

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config DVB
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt6000=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y
          CONFIG_DVB_CORE=y
          CONFIG_DVB_USB=y
          CONFIG_DVB_USB_V2=y
          CONFIG_DVB_AF9033=y
          CONFIG_DVB_USB_AF9035=y
          CONFIG_DVB_RTL28XXU=y
          CONFIG_DVB_USB_RTL28XXU=y
          CONFIG_PACKAGE_kmod-media-core=y
          CONFIG_PACKAGE_kmod-dvb-core=y
          CONFIG_PACKAGE_kmod-dvb-usb=y
          CONFIG_PACKAGE_kmod-dvb-usb-v2=y
          CONFIG_PACKAGE_kmod-dvb-af9033=y
          CONFIG_PACKAGE_kmod-dvb-usb-af9035=y
          CONFIG_PACKAGE_kmod-dvb-rtl28xxu=y
          CONFIG_PACKAGE_kmod-dvb-usb-rtl28xxu=y
          CONFIG_PACKAGE_kmod-i2c-mux=y
          EOF
          make defconfig

      - name: Build
        run: make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-mt6000-dvb
          path: bin/targets/mediatek/filogic/*sysupgrade.bin
