name: build-dvb-mt6000
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk unzip wget python3

      - name: Download OpenWrt SDK 25.12.5 filogic
        run: |
          wget https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf *.tar.zst
          mv openwrt-sdk-* sdk
          ls sdk

      - name: Enable DVB in config
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_kmod-dvb-core=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-v2=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-af9033=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-af9035=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=m" >> .config
          make defconfig

      - name: Build only DVB
        run: |
          cd sdk
          make package/kernel/linux/compile -j$(nproc) V=s

      - name: Collect
        run: |
          find sdk/bin -name "*.apk" -o -name "*.ipk" | xargs ls -lh
          mkdir -p out
          find sdk/bin -name "*dvb*.apk" -o -name "*af9035*.apk" -o -name "*dvb*.ipk" | xargs -I {} cp {} out/ || true
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kmod-dvb-mt6000
          path: out/
