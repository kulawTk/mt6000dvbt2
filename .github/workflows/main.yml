name: build-dvb-mt6000
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd

      - name: Download SDK
        run: |
          rm -rf sdk sdk.tar.zst
          wget -O sdk.tar.zst https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mkdir -p sdk
          tar -I zstd -xf sdk.tar.zst --strip-components=1 -C sdk
          ls -lh sdk

      - name: Enable DVB
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_kmod-dvb-core=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-v2=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-af9033=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-af9035=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-rtl28xxu=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb2=m" >> .config
          make defconfig
          grep -i dvb .config

      - name: Build kernel
        run: |
          cd sdk
          make package/kernel/linux/compile -j$(nproc) V=s 2>&1 | tee /tmp/build.log || true

      - name: Build DVB modules
        run: |
          cd sdk
          make package/kernel/dvb-core/compile -j$(nproc) V=s 2>&1 | tee -a /tmp/build.log || true
          make package/kernel/dvb-usb/compile -j$(nproc) V=s 2>&1 | tee -a /tmp/build.log || true
          make package/kernel/dvb/compile -j$(nproc) V=s 2>&1 | tee -a /tmp/build.log || true
          tail -n 200 /tmp/build.log

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          find sdk -name "*dvb*.apk" 2>/dev/null | tee /tmp/found.txt
          cat /tmp/found.txt
          find sdk -name "*dvb*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/
          echo "=== TOTAL ==="
          du -sh out/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-dvb-mt6000
          path: out/
