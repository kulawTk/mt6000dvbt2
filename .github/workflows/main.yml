name: build-dvb-mt6000
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd

      - name: Download SDK
        run: |
          rm -rf sdk openwrt-sdk-*
          wget -q https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xf *.tar.zst
          mv openwrt-sdk-25.12.5-mediatek-filogic* sdk

      - name: Enable DVB
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_kmod-dvb-core=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-v2=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-af9033=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-af9035=m" >> .config
          make defconfig
          cat .config | grep DVB

      - name: Build
        run: |
          cd sdk
          make package/kernel/linux/compile -j$(nproc) V=s 2>&1 | tee /tmp/build.log || true

      - name: Show fail
        if: always()
        run: |
          tail -n 200 /tmp/build.log
          mkdir -p out
          find sdk/bin -name "*.apk" 2>/dev/null | grep dvb || echo "no apk yet"
          find sdk -name "*.ko" 2>/dev/null | grep af903 | head
          cp /tmp/build.log out/ || true
          ls -lh sdk/bin/targets/mediatek/filogic/packages/ 2>/dev/null | tail -n 100 || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-dvb-mt6000
          path: out/
