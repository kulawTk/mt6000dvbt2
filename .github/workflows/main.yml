name: build-dvb-mt6000
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget git

      - name: Clone GL builder
        run: |
          git clone https://github.com/gl-inet/gl-infra-builder.git
          cd gl-infra-builder
          # lista configów - wybieramy mt6000
          ls configs/ | grep mt6000
          cp configs/config-mt6000-4.x .config || cp configs/config-mt6000 .config

      - name: Enable DVB
        run: |
          cd gl-infra-builder
          echo "CONFIG_PACKAGE_kmod-dvb-core=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-v2=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-af9033=m" >> .config
          echo "CONFIG_PACKAGE_kmod-dvb-usb-af9035=m" >> .config
          echo "CONFIG_PACKAGE_kmod-i2c-mux=m" >> .config
          ./scripts/gen_config.py || python3 scripts/gen_config.py

      - name: Build kmods only
        run: |
          cd gl-infra-builder
          make download -j8
          make package/kernel/linux/compile V=s -j$(nproc)

      - name: Find APKs
        run: |
          find gl-infra-builder/bin -name "*dvb*.apk" -o -name "*af9035*.apk" | xargs ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kmod-dvb-mt6000
          path: gl-infra-builder/bin/**/*.apk
