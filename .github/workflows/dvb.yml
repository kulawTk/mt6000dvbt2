name: build-dvb-mt6000
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd

      - name: Download SDK
        run: |
          wget -O sdk.tar.zst https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mkdir sdk && tar -I zstd -xf sdk.tar.zst --strip-components=1 -C sdk

      - name: Enable DVB
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-dvb-core=m
          CONFIG_PACKAGE_kmod-dvb-usb=m
          CONFIG_PACKAGE_kmod-dvb-usb-af9035=m
          CONFIG_PACKAGE_kmod-dvb-af9033=m
          CONFIG_PACKAGE_kmod-dvb-usb-rtl28xxu=m
          CONFIG_PACKAGE_kmod-i2c-mux=m
          EOF
          make defconfig
          grep -i dvb .config

      - name: Full Build
        run: |
          cd sdk
          make -j$(nproc) V=s 2>&1 | tee /tmp/build.log
          echo "=== BUILD FINISHED ==="

      - name: Collect ONLY DVB
        if: always()
        run: |
          mkdir -p out
          find sdk/bin -name "*dvb*.apk" -exec cp -v {} out/ \; 2>&1 | tee /tmp/found.txt
          ls -lh out/
          du -sh out/
          cp /tmp/build.log out/ || true
          cp /tmp/found.txt out/ || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-dvb-mt6000
          path: out/
